<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Mirai 2026</title>
  <link rel="stylesheet" href="/magical-mirai-2026/style.css" />
</head>
<body>

  <!-- Three.js crée son propre canvas via WebGLRenderer -->

  <!-- Modal de sélection de musique -->
  <div id="song-modal">
    <div id="modal-box">
      <h2>Choisir une musique</h2>
      <div id="song-list">
        <button class="song-opt" data-song="kotaete">
          <span class="song-opt-title">こたえて</span>
          <span class="song-opt-artist">imie</span>
        </button>
        <button class="song-opt" data-song="after">
          <span class="song-opt-title">アフター・ザ・カーテン</span>
          <span class="song-opt-artist">Rulmry</span>
        </button>
        <button class="song-opt" data-song="shutter">
          <span class="song-opt-title">シャッターチャンス</span>
          <span class="song-opt-artist">夜未アガリ</span>
        </button>
        <button class="song-opt" data-song="sekai">
          <span class="song-opt-title">世界最後の音楽隊</span>
          <span class="song-opt-artist">夏山よつぎ×ど～ぱみん</span>
        </button>
        <button class="song-opt" data-song="tori">
          <span class="song-opt-title">トリツクロジー</span>
          <span class="song-opt-artist">鶴三</span>
        </button>
        <button class="song-opt" data-song="takeover">
          <span class="song-opt-title">TAKEOVER</span>
          <span class="song-opt-artist">Twinfield</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Player flottant -->
  <div id="player" style="display:none">
    <div id="player-top">
      <div id="song-info">
        <span id="song-title">—</span>
        <span id="song-artist"></span>
      </div>
      <div id="time-display">
        <span id="time-cur">0:00</span>
        <span id="time-sep">/</span>
        <span id="time-dur">0:00</span>
      </div>
    </div>

    <!-- Barre de progression / thème -->
    <div id="progress-track">
      <div id="progress-fill"></div>
      <div id="progress-sun"></div>
    </div>

    <div id="player-controls">
      <button id="btn-play" disabled>
        <svg id="icon-play"  viewBox="0 0 16 16"><polygon points="4.5,1 15,8 4.5,15"/></svg>
        <svg id="icon-pause" viewBox="0 0 16 16" style="display:none"><rect x="2" y="1" width="4" height="14"/><rect x="10" y="1" width="4" height="14"/></svg>
      </button>
      <button id="btn-mute" title="Mute">
        <svg id="icon-vol" viewBox="0 0 16 16"><path d="M2 5h2.5L8 2v12L4.5 11H2a1 1 0 01-1-1V6a1 1 0 011-1z" fill="rgba(255,255,255,0.7)"/><path d="M10 4.5c1.2 1 2 2.1 2 3.5s-.8 2.5-2 3.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round"/></svg>
        <svg id="icon-muted" viewBox="0 0 16 16" style="display:none"><path d="M2 5h2.5L8 2v12L4.5 11H2a1 1 0 01-1-1V6a1 1 0 011-1z" fill="rgba(255,255,255,0.35)"/><line x1="10" y1="5" x2="14" y2="11" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linecap="round"/><line x1="14" y1="5" x2="10" y2="11" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="status">Chargement…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script src="https://unpkg.com/axios@1.21.0/dist/axios.min.js" integrity="sha384-p5EwRuz37ylAY9QrjGGIs9ngKVaIwppUFSourks9EIRp1CzoIDWoQkXrHxaAUhEB" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/textalive-app-api@0.5.3/dist/index.js" integrity="sha384-VJtJHnvyn/eDticbhZF5UYf1oXh70A6g6s/q+QilXg3WxUPVC4FPvQhg4eqFunxp" crossorigin="anonymous"></script>
  <script type="module" src="/magical-mirai-2026/sketch.js"></script>
  <script type="module" src="/magical-mirai-2026/audio.js"></script>
  <script type="module" src="/magical-mirai-2026/main.js"></script>
</body>
</html>
